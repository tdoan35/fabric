# Fabric CI — required gate for every PR (plan §6).
# Two jobs:
#   verify — REQUIRED for merge (branch protection context: "verify").
#   lint   — report-only until the 6 pre-existing errors in apps/web are fixed
#            (5x react-hooks setState-in-effect, 1x unused import). Then move
#            lint into verify and delete this note.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres for the runtime's second driver (ANY-26). pgvector at Neon's major
    # version: a plain image would pass here and fail on vector columns in production.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # Throwaway container reachable only from this job: trust auth, so no
          # password exists anywhere in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check Postgres has pgvector
        run: psql "postgres://postgres@localhost:5432/runtime_test" -tAc "create extension if not exists vector; select extversion from pg_extension where extname = 'vector'"

      - name: Unit tests
        run: npm test
        env:
          # Runtime tests only (packages/runtime). Never DATABASE_URL, so nothing else
          # picks it up. With CI set, a missing URL fails the runtime suite (ANY-31).
          RUNTIME_TEST_DATABASE_URL: postgres://postgres@localhost:5432/runtime_test

      - name: Build
        run: npm run build

      # Mutation testing (ANY-25). A no-op until a workspace defines `mutate`; the
      # pass mark is `thresholds.break` in that package's stryker.config.json.
      - name: Mutation tests
        run: npm run mutate --workspaces --if-present

      - name: Build Storybook
        run: npm run build-storybook -w web

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser story tests (interaction + a11y, vitest project "storybook")
        run: npm run test-storybook -w web

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
