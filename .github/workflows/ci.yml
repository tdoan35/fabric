# Fabric CI — required gate for every PR (plan §6).
# Two jobs:
#   verify — REQUIRED for merge (branch protection context: "verify").
#   lint   — report-only until the 6 pre-existing errors in apps/web are fixed
#            (5x react-hooks setState-in-effect, 1x unused import). Then move
#            lint into verify and delete this note.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook -w web

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser story tests (interaction + a11y, vitest project "storybook")
        run: npm run test-storybook -w web

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
